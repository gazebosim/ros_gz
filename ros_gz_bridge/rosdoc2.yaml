## rosdoc2 configuration for ros_gz_bridge.

## This 'attic section' self-documents this file's type and version.
type: 'rosdoc2 config'
version: 1

---

settings:
  always_run_doxygen: true
  ## Document the Python launch action plugin alongside the C++ API.
  always_run_sphinx_apidoc: true
  python_source: 'ros_gz_bridge'

builders:
    - doxygen: {
        name: 'ros_gz_bridge Public C/C++ API',
        output_dir: 'generated/doxygen',
        extra_doxyfile_statements: [
            'EXTRACT_ALL = YES',
            'EXTRACT_PRIVATE = NO',
            'EXTRACT_STATIC = YES',
            'ENABLE_PREPROCESSING = YES',
            ## Expand the symbol visibility macro to nothing, so that Doxygen
            ## can parse the declarations that use it.
            'MACRO_EXPANSION = YES',
            'EXPAND_ONLY_PREDEF = YES',
            'PREDEFINED = ROS_GZ_BRIDGE_VISIBLE=',
        ]
    }
    - sphinx: {
        name: 'ros_gz_bridge',
        sphinx_sourcedir: doc,
        doxygen_xml_directory: 'generated/doxygen/xml',
        output_dir: ''
    }
